<div class="login-page">

  <main class="login-container">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <header class="brand">

      <div class="brand-logo">
        L
      </div>

      <div class="brand-name">
        LiftLog
      </div>

    </header>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <section class="hero">

      <p class="eyebrow">
        YOUR FITNESS JOURNEY
      </p>

      <h1>
        Become<br />
        stronger.<br />
        Feel better.<br />

        <span>
          Live better.
        </span>
      </h1>

      <p class="hero-description">
        Track your workouts, build healthy habits, and stay
        consistent with your fitness journey.
      </p>

    </section>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <section class="login-card">

      <div class="login-heading">

        <h2>
          Welcome back 👋
        </h2>

        <p>
          Sign in to continue your fitness journey.
        </p>

      </div>


      <form
        class="login-form"
        (ngSubmit)="signIn()"
      >

        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          />

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <div class="password-label-row">

            <label for="password">
              Password
            </label>

            <button
              class="forgot-password"
              type="button"
            >
              Forgot password?
            </button>

          </div>


          <div class="password-wrapper">

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />


            <button
              class="password-toggle"
              type="button"
              aria-label="Toggle password visibility"
              (click)="togglePasswordVisibility()"
            >
              {{ showPassword ? '🙈' : '👁️' }}
            </button>

          </div>

        </div>


        <!-- SIGN IN -->

        <button
          class="sign-in-button"
          type="submit"
        >
          <span>
            Sign In
          </span>

          <span class="sign-in-arrow">
            →
          </span>
        </button>

      </form>


      <!-- =================================================
           DIVIDER
      ================================================== -->

      <div class="divider">

        <span></span>

        <p>
          or continue with
        </p>

        <span></span>

      </div>


      <!-- =================================================
           GOOGLE
      ================================================== -->

      <button
        class="social-button"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        <span>
          Continue with Google
        </span>

      </button>


      <!-- =================================================
           PHONE
      ================================================== -->

      <button
        class="social-button"
        type="button"
      >

        <span class="phone-icon">
          ☎
        </span>

        <span>
          Continue with Phone Number
        </span>

      </button>


      <!-- =================================================
           SIGN UP
      ================================================== -->

      <div class="signup-link">

        <span>
          Don't have an account?
        </span>

        <button
          type="button"
          (click)="goToSignup()"
        >
          Sign up
        </button>

      </div>

    </section>

  </main>

</div>
