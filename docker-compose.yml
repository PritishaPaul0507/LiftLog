services:

  backend:
    build:
      context: .
      dockerfile: BE/Dockerfile

    container_name: liftlog-backend

    ports:
      - "8001:8001"

    env_file:
      - BE/.env

    environment:
      DATABASE_URL: sqlite:////data/liftlog.db

    volumes:
      - ./liftlog.db:/data/liftlog.db

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: FE/Dockerfile

    container_name: liftlog-frontend

    ports:
      - "4200:4200"

    depends_on:
      - backend

    restart: unless-stopped